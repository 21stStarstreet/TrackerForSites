server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/x-font-ttf;

    # /api/* → .NET API'ye proxy
    location /api/ {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        ""; # Upstream'e keep-alive

        # SSE bağlantıları dakikalarca açık kalır.
        # Varsayılan 60s timeout SSE'yi keser — 1 saate çıkarıyoruz.
        # API X-Accel-Buffering: no başlığı ile SSE response'larında buffering'i
        # otomatik devre dışı bırakır, ayrıca nginx ayarı gerekmez.
        proxy_read_timeout 3600s;
    }

    # SPA routing — React Router için tüm 404'leri index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik asset cache (Vite hash'li dosyalar için)
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
