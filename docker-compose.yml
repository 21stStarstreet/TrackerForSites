# TrackerForSites | Docker Compose
#
# Tek komutla her şeyi başlatır:
#   docker compose up -d
#
# Veritabanı şeması ilk açılışta db/schema.sql üzerinden otomatik oluşturulur.
# Sonradan manuel uygulama gerekmez.
#
# Servisler:
#   db        → PostgreSQL 16         → localhost:5432
#   api       → .NET 8 WebAPI         → localhost:5000
#   dashboard → Nginx + React build   → localhost:80

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: trackerfs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       trackerdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trackerdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── .NET 8 API ────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: trackerfs-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=trackerdb;Username=postgres;Password=${DB_PASSWORD:-postgres}"
      Jwt__Key:                    ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer:                 TrackerForSites
      Jwt__Audience:               TrackerForSites
      Jwt__AccessTokenExpiryMinutes:  15
      Jwt__RefreshTokenExpiryDays:    30
      Cors__AllowedOrigins__0:     ${DASHBOARD_ORIGIN:-http://localhost}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── React Dashboard (Nginx) ───────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL:     ""           # Nginx proxy kullanıldığı için boş
        VITE_TRACKER_URL: ${TRACKER_URL:-https://yourdomain.com/tracker.js}
    container_name: trackerfs-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  db_data:
